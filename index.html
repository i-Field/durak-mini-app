<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Durak Empire</title>
<style>
:root{--bg:#101512;--felt:#22362c;--gold:#c2a265;--tx:#e6e1d3;--mut:#8fa196;--red:#a64a50;--blk:#22262a;--pan:#1a231e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.hidden{display:none!important}
.scr{height:100%;display:flex;flex-direction:column;padding:12px;max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--pan);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
.who{display:flex;align-items:center;gap:8px}.av{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:20px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
h1{margin:0;font-size:34px;letter-spacing:2px;color:var(--gold)}.sub{color:var(--mut);margin:0 0 18px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;background:var(--gold);color:#2a1d00;width:100%;cursor:pointer}
.btn.sec{background:var(--pan);color:var(--tx)}.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;width:100%}
.tile{background:var(--pan);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:0;color:var(--tx);font:inherit}
.tile b{display:block;margin-top:4px}.tile small{color:var(--mut)}
.felt{flex:1;background:var(--felt);border-radius:18px;margin:8px 0;padding:8px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.row{display:flex;justify-content:center;min-height:96px}
.row .c{margin-left:-30px}.row .c:first-child{margin-left:0}
.hand{overflow-x:auto;justify-content:flex-start;padding:14px 6px 4px}.hand .c{margin-left:-16px}.hand .c:first-child{margin-left:0}
.hand.mid{justify-content:center}
.c{width:58px;height:84px;border-radius:8px;background:#e9e3d2;color:var(--blk);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;font-weight:700;flex:none;box-shadow:0 2px 6px #0007;border:2px solid #0002;user-select:none}.c.sm{width:42px;height:60px;font-size:15px}.c.sm i{font-size:18px}
.c i{font-style:normal;font-size:24px;line-height:1}.c.r{color:var(--red)}.c.t{border-color:var(--gold)}
.c.back{background:repeating-linear-gradient(45deg,#4a2a33,#4a2a33 6px,#3b212a 6px,#3b212a 12px);border-color:#cfc8b6}
.mine .c{cursor:pointer}.mine .c:active{transform:translateY(-8px)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tbl{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;align-content:center;flex:1;padding:6px}
.pair{position:relative;width:76px;height:100px}.pair .c{position:absolute;margin:0}.pair .d{left:18px;top:14px;transform:rotate(9deg)}
.info{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.deck{display:flex;align-items:center;gap:6px}.deck b{color:var(--tx);font-size:20px}
.stat{text-align:center;font-weight:600;min-height:20px;font-size:14px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:5}
.box{background:var(--pan);border-radius:18px;padding:18px;width:100%;max-width:400px;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;text-align:center}.box p{margin:0;color:var(--mut);text-align:center}
.lr{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:#0003}.lr.me{background:#f5c04a33}
</style></head><body>
<div id="menu" class="scr">
 <div class="top"><div class="who"><div class="av">👑</div><div><div id="nm">Empire Player</div><small style="color:var(--mut)">VIP Member</small></div></div>
 <div style="display:flex;gap:6px"><div class="chip" id="coins">🪙</div><div class="chip" id="stars">⭐</div></div></div>
 <div class="hero"><h1>DURAK EMPIRE</h1><p class="sub">Элитный подкидной дурак в Telegram</p>
 <button class="btn" onclick="start()">⚡ Начать битву (Ставка: 150 🪙)</button>
 <button class="btn sec" id="bonus" style="margin-top:10px" onclick="daily()">🎁 Ежедневный бонус +500</button>
 <div class="grid">
  <button class="tile" onclick="openOnline()">🌐<b>Онлайн столы</b><small>PvP с друзьями</small></button>
  <button class="tile" onclick="invite()">🎁<b>Пригласить</b><small>Поделиться игрой</small></button>
  <button class="tile" onclick="openShop()">💎<b>Магазин</b><small>Звезды и фишки</small></button>
  <button class="tile" onclick="openRating()">🏆<b>Рейтинг</b><small>Лига чемпионов</small></button>
 </div></div>
</div>
<div id="game" class="scr hidden">
 <div class="top"><button class="chip" style="border:0;color:var(--tx)" onclick="surrender()">🚪 Сдаться</button><div class="chip" id="tm">⏳ 10с</div><div class="chip" id="gc">🪙</div></div>
 <div class="felt">
  <div class="row" id="opp"></div>
  <div class="info"><div class="deck" id="pile"></div><div class="deck">Козырь: <b id="tr"></b></div></div>
  <div class="tbl" id="tbl"></div>
  <div class="stat" id="st"></div>
 </div>
 <div class="row hand mine" id="me"></div>
 <button class="btn" id="act" style="margin-top:8px" onclick="actBtn()">Ход бота</button>
</div>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>
<script>
const S=['♠','♥','♦','♣'],R=[6,7,8,9,10,11,12,13,14],RL={6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A'};
const $=id=>document.getElementById(id),BET=150,API='';
let save={coins:2500,wins:0,losses:0,bonus:''};
try{Object.assign(save,JSON.parse(localStorage.getItem('de')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('de',JSON.stringify(save))}catch(e){}};
const tg=window.Telegram&&window.Telegram.WebApp;
try{if(tg){tg.ready();tg.expand()}}catch(e){}
const rating=()=>Math.max(0,100+save.wins*10-save.losses*5);
function hud(){$('coins').textContent='🪙 '+save.coins.toLocaleString('ru');$('gc').textContent=$('coins').textContent;$('stars').textContent='⭐ '+rating();
 const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&u.first_name)$('nm').textContent=u.first_name;
 $('bonus').classList.toggle('hidden',save.bonus===new Date().toDateString())}
function modal(html){$('mbox').innerHTML=html;$('modal').classList.remove('hidden')}
function closeM(){$('modal').classList.add('hidden')}
function show(id){if(id==='menu')leave();$('menu').classList.toggle('hidden',id!=='menu');$('game').classList.toggle('hidden',id!=='game');hud()}
function daily(){save.coins+=500;save.bonus=new Date().toDateString();persist();hud()}
let PVP=false,ws=null;const WS='wss://YOUR-WORKER.workers.dev',BOT='YOUR_BOT_USERNAME',O=()=>PVP?'Соперник':'Бот';
const rc=()=>Math.random().toString(36).slice(2,8).toUpperCase();
function openOnline(){modal('<h2>🌐 Онлайн столы</h2><p>Создайте стол и отправьте ссылку другу или войдите по коду</p><button class="btn" onclick="pvpJoin(rc(),1)">➕ Создать стол (150 🪙)</button><input id="rcode" maxlength="12" placeholder="Код стола" style="padding:12px;border-radius:12px;border:0;background:#0004;color:inherit;font-size:16px;text-align:center"><button class="btn sec" onclick="pvpJoin($(\'rcode\').value.trim().toUpperCase())">Войти по коду</button><button class="btn sec" onclick="closeM()">Закрыть</button>')}
function shareRoom(r){const u='https://t.me/share/url?url='+encodeURIComponent('https://t.me/'+BOT+'?start='+r)+'&text='+encodeURIComponent('Сыграем в дурака? 🃏');if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
function waitBox(r){modal('<h2>⏳ Ждём соперника</h2><p>Код стола: <b>'+r+'</b></p><button class="btn" onclick="shareRoom(\''+r+'\')">📨 Пригласить друга</button><button class="btn sec" onclick="closeM();show(\'menu\')">Отмена</button>')}
function leave(){PVP=false;if(ws){try{ws.close()}catch(e){}ws=null}}
function pvpJoin(r,share){if(!r)return;if(save.coins<BET){closeM();return openShop()}
 if(WS.includes('YOUR-WORKER')){modal('<h2>Сервер не подключён</h2><p>Укажите адрес Cloudflare Worker в константе WS.</p><button class="btn" onclick="closeM()">Ок</button>');return}
 leave();PVP=true;G=null;waitBox(r);if(share)shareRoom(r);
 const w=ws=new WebSocket(WS+'/ws?room='+encodeURIComponent(r)+'&name='+encodeURIComponent($('nm').textContent));
 w.onmessage=e=>{const v=JSON.parse(e.data);
  if(v.t==='wait')waitBox(r);
  else if(v.t==='full'){leave();modal('<h2>Стол занят</h2><button class="btn" onclick="closeM()">Ок</button>')}
  else if(v.t==='state'){if(!G||G.over){save.coins-=BET;persist()}
   const dk=new Array(v.deck);if(v.deck)dk[0]=v.trumpCard;
   G={p:v.hand,b:new Array(v.opp).fill(0),table:v.table,att:v.att,taking:v.taking&&v.att==='p',trump:v.tr,deck:dk,busy:false,over:false,t:10};closeM();show('game');render()}
  else if(v.t==='over')finish(v.res)};
 w.onclose=()=>{if(ws===w&&PVP&&G&&!G.over)finish('lose')}}
function pvpAgain(){if(ws&&ws.readyState===1){ws.send(JSON.stringify({t:'again'}));modal('<h2>⏳ Ждём ответа соперника</h2><button class="btn sec" onclick="closeM();show(\'menu\')">В меню</button>')}else{closeM();show('menu')}}
function invite(){const u='https://t.me/share/url?url='+encodeURIComponent(location.href.split('#')[0])+'&text='+encodeURIComponent('Сыграем в Durak Empire? 🃏');
 if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
function openRating(){const L=[['Император',420],['Шулер',310],['Граф',240],['Тихий Дон',190],['Валет',140],['Новичок',60]].concat([[($('nm').textContent||'Вы'),rating(),1]]).sort((a,b)=>b[1]-a[1]);
 modal('<h2>🏆 Рейтинг</h2>'+L.map((x,i)=>'<div class="lr '+(x[2]?'me':'')+'"><span>'+(i+1)+'. '+x[0]+'</span><b>⭐ '+x[1]+'</b></div>').join('')+'<p>Побед: '+save.wins+' · Поражений: '+save.losses+'</p><button class="btn" onclick="closeM()">Закрыть</button>')}
const PACKS=[[2000,35],[6000,90],[15000,200]];
function openShop(){modal('<h2>💎 Магазин Империи</h2><p>Пополните баланс за Telegram Stars ⭐</p>'+PACKS.map((p,i)=>'<button class="btn" onclick="buy('+i+')">📦 '+p[0].toLocaleString('ru')+' монет ('+p[1]+' ⭐)</button>').join('')+'<button class="btn sec" onclick="closeM()">Закрыть</button>')}
function buy(i){const p=PACKS[i],grant=()=>{save.coins+=p[0];persist();hud();closeM()};
 if(API&&tg&&tg.openInvoice){fetch(API+'/invoice?pack='+i+'&uid='+encodeURIComponent((tg.initDataUnsafe.user||{}).id)).then(r=>r.json()).then(j=>tg.openInvoice(j.link,s=>{if(s==='paid')grant()})).catch(()=>alert('Ошибка оплаты'))}
 else if(tg)alert('Оплата Stars пока не подключена к серверу бота.');else grant()}
/* ---------- game ---------- */
let G=null;
const val=c=>c.r+(c.s===G.trump?20:0),def=()=>G.att==='p'?'b':'p',undef=()=>G.table.filter(x=>!x.d);
const beats=(d,a)=>d.s===a.s?d.r>a.r:(d.s===G.trump&&a.s!==G.trump);
function start(){closeM();if(save.coins<BET){openShop();return}
 save.coins-=BET;persist();const d=[];for(let s=0;s<4;s++)for(const r of R)d.push({s,r});
 for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 G={deck:d,p:[],b:[],table:[],att:'p',taking:false,cap:6,busy:false,over:false,t:10,trump:d[0].s};
 fill('p');fill('b');const lt=h=>Math.min(99,...h.filter(c=>c.s===G.trump).map(c=>c.r)),a=lt(G.p),b=lt(G.b);
 G.att=a<b?'p':b<a?'b':(Math.random()<.5?'p':'b');show('game');round()}
function fill(w){while(G[w].length<6&&G.deck.length)G[w].push(G.deck.pop())}
function round(){G.table=[];G.taking=false;G.cap=Math.min(6,G[def()].length);G.t=10;next()}
function later(f,ms){const g=G;G.busy=true;setTimeout(()=>{if(G!==g||g.over)return;g.busy=false;f()},ms||700)}
function playerTurn(){const u=undef().length;return !G.busy&&!G.over&&((G.att==='b'&&u>0)||(G.att==='p'&&(G.taking||u===0)))}
function next(){if(G.over)return;render();const u=undef();
 if(G.att==='b'){if(u.length)return;
  if(G.table.length&&G.p.length===0)return later(()=>endRound(false));
  const c=botPick();if(c)later(()=>{G.b.splice(G.b.indexOf(c),1);G.table.push({a:c});G.t=10;next()});else if(G.table.length)later(()=>endRound(false))}
 else{if(G.taking)return;
  if(u.length)return later(botDefend);
  if(G.table.length&&(G.b.length===0||G.p.length===0))later(()=>endRound(false))}}
function ranks(){return new Set(G.table.flatMap(x=>x.d?[x.a.r,x.d.r]:[x.a.r]))}
function botPick(){if(G.table.length>=G.cap)return null;const rk=ranks(),h=G.b.slice().sort((x,y)=>val(x)-val(y));
 const ok=h.filter(c=>!G.table.length||rk.has(c.r));if(!ok.length)return null;const c=ok[0];
 if(G.table.length&&c.s===G.trump&&G.deck.length>0)return null;return c}
function botDefend(){const u=G.table.find(x=>!x.d);if(!u)return next();
 const o=G.b.filter(c=>beats(c,u.a)).sort((x,y)=>val(x)-val(y));
 if(!o.length){G.taking=true;G.t=10;return next()}
 G.b.splice(G.b.indexOf(o[0]),1);u.d=o[0];G.t=10;next()}
function play(i){if(!playerTurn())return;if(PVP)return ws.send(JSON.stringify({t:'play',i}));const c=G.p[i];
 if(G.att==='p'){if(G.table.length&&(!ranks().has(c.r)||G.table.length>=G.cap))return bad(i);
  G.p.splice(i,1);G.table.push({a:c});G.t=10;next()}
 else{const u=undef().find(x=>beats(c,x.a));if(!u)return bad(i);G.p.splice(i,1);u.d=c;G.t=10;next()}}
function bad(i){const e=$('me').children[i];if(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}}
function actBtn(){if(!playerTurn())return;if(PVP)return ws.send(JSON.stringify({t:'act'}));
 if(G.att==='b')takeP();else if(G.taking)endRound(true);else if(G.table.length)endRound(false)}
function takeP(){G.busy=true;while(G.table.length<G.cap){const rk=ranks(),c=G.b.filter(c=>rk.has(c.r)&&(c.s!==G.trump||!G.deck.length)).sort((x,y)=>val(x)-val(y))[0];if(!c)break;G.b.splice(G.b.indexOf(c),1);G.table.push({a:c})}
 render();const g=G;setTimeout(()=>{if(G===g&&!g.over){g.busy=false;endRound(true)}},600)}
function endRound(taken){if(G.over)return;const w=def();
 if(taken)G[w].push(...G.table.flatMap(x=>x.d?[x.a,x.d]:[x.a]));G.table=[];
 fill(G.att);fill(w);
 if(!G.deck.length){const pe=!G.p.length,be=!G.b.length;if(pe&&be)return finish('draw');if(pe)return finish('win');if(be)return finish('lose')}
 if(!taken)G.att=w;round()}
function finish(r){G.over=true;let t,m;
 if(r==='win'){save.wins++;save.coins+=BET*2;t='🏆 Победа!';m='Вы победили бота и выиграли '+BET+' монет!'}
 else if(r==='draw'){save.coins+=BET;t='🤝 Ничья';m='Ставка возвращена.'}
 else{save.losses++;t='💀 Поражение';m='Вы проиграли '+BET+' монет. Реванш?'}
 persist();hud();render();
 modal('<h2>'+t+'</h2><p>'+m+'</p><button class="btn" onclick="(PVP?pvpAgain:start)()">⚔️ Реванш (150 🪙)</button><button class="btn sec" onclick="closeM();show(\'menu\')">В главное меню</button>')}
function surrender(){if(!G||G.over)return;if(confirm('Сдаться? Ставка будет потеряна.')){finish('lose');leave()}}
const card=(c,e)=>'<div class="c '+(c.s===1||c.s===2?'r':'')+(c.s===G.trump?' t':'')+'"'+(e||'')+'><b>'+RL[c.r]+'</b><i>'+S[c.s]+'</i></div>';
function render(){
 $('opp').innerHTML=G.b.map(()=>'<div class="c back"></div>').join('');
 const tc=$('tr');tc.textContent=S[G.trump];tc.style.color=(G.trump===1||G.trump===2)?'#c9696f':'';$('pile').innerHTML=G.deck.length?card(G.deck[0]).replace('class="c ','class="c sm ')+'<div class="c sm back" style="margin-left:-14px"></div><span>Колода: <b>'+G.deck.length+'</b></span>':'<span>Колода пуста</span>';
 $('tbl').innerHTML=G.table.map(x=>'<div class="pair">'+card(x.a)+(x.d?card(x.d).replace('class="c ','class="c d '):'')+'</div>').join('');
 const m=$('me');m.innerHTML=G.p.map((c,i)=>card(c,' onclick="play('+i+')"')).join('');m.classList.toggle('mid',G.p.length<=6);
 const u=undef().length,b=$('act');let s,l,en=playerTurn();
 if(G.att==='b'){s=u?'Бейте карту или возьмите':O()+' ходит…';l='Взять'}
 else if(G.taking){s=O()+' берёт — подкиньте или нажмите Готово';l='Готово'}
 else if(u){s=O()+' отбивается…';l='Ход бота'}
 else{s=G.table.length?'Подкиньте карту или нажмите Бито':'Ваш ход — атакуйте';l=G.table.length?'Бито':'Ваш ход'}
 if(G.over){s='';l='Игра окончена'}
 $('st').textContent=s;b.textContent=l;b.disabled=!en||(G.att==='p'&&!G.taking&&!G.table.length);tick()}
function tick(){$('tm').textContent=PVP?(playerTurn()?'✋ Ваш ход':'⏳ Ход соперника'):(playerTurn()?'⏳ '+G.t+'с':'🤖 ход бота')}
setInterval(()=>{if(!G||G.over||$('game').classList.contains('hidden'))return;
 if(PVP||!playerTurn()){G.t=10;return tick()}
 if(--G.t>0)return tick();G.t=10;
 if(G.att==='b')takeP();else if(G.taking||G.table.length)endRound(G.taking);
 else{const i=G.p.reduce((a,c,k)=>val(c)<val(G.p[a])?k:a,0);play(i)}},1000);
hud();
const sp=new URLSearchParams(location.search).get('room')||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param);if(sp)pvpJoin(String(sp).toUpperCase());
</script></body></html>
