<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Durak Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101512;--felt:#22362c;--gold:#c2a265;--tx:#e6e1d3;--mut:#8fa196;--red:#a64a50;--blk:#22262a;--pan:#1a231e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.hidden{display:none!important}
.scr{height:100%;display:flex;flex-direction:column;padding:12px;max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--pan);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
.who{display:flex;align-items:center;gap:8px}.av{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:20px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
h1{margin:0;font-size:34px;letter-spacing:2px;color:var(--gold)}.sub{color:var(--mut);margin:0 0 18px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;background:var(--gold);color:#2a1d00;width:100%;cursor:pointer}
.btn.sec{background:var(--pan);color:var(--tx)}.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;width:100%}
.tile{background:var(--pan);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:0;color:var(--tx);font:inherit}
.tile b{display:block;margin-top:4px}.tile small{color:var(--mut)}
.felt{flex:1;background:var(--felt);border-radius:18px;margin:8px 0;padding:8px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.row{display:flex;justify-content:center;min-height:96px}
.row .c{margin-left:-30px}.row .c:first-child{margin-left:0}
.hand{overflow-x:auto;justify-content:flex-start;padding:14px 6px 4px}.hand .c{margin-left:-16px}.hand .c:first-child{margin-left:0}
.hand.mid{justify-content:center}
.c{width:58px;height:84px;border-radius:8px;background:#e9e3d2;color:var(--blk);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;font-weight:700;flex:none;box-shadow:0 2px 6px #0007;border:2px solid #0002;user-select:none}.c.sm{width:42px;height:60px;font-size:15px}.c.sm i{font-size:18px}
.c i{font-style:normal;font-size:24px;line-height:1}.c.r{color:var(--red)}.c.t{border-color:var(--gold)}
.c.back{background:repeating-linear-gradient(45deg,#4a2a33,#4a2a33 6px,#3b212a 6px,#3b212a 12px);border-color:#cfc8b6}
.mine .c{cursor:pointer}.mine .c:active{transform:translateY(-8px)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tbl{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;align-content:center;flex:1;padding:6px}
.pair{position:relative;width:76px;height:100px}.pair .c{position:absolute;margin:0}.pair .d{left:18px;top:14px;transform:rotate(9deg)}
.info{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.deck{display:flex;align-items:center;gap:6px}.deck b{color:var(--tx);font-size:20px}
.stat{text-align:center;font-weight:600;min-height:20px;font-size:14px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:5}
.box{background:var(--pan);border-radius:18px;padding:18px;width:100%;max-width:400px;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;text-align:center}.box p{margin:0;color:var(--mut);text-align:center}
.lr{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:#0003}.lr.me{background:#f5c04a33}

.menu{position:relative;overflow-y:auto}
.menu>*{position:relative;z-index:1}
.menu>.art{position:absolute;z-index:0;left:0;right:0;top:0;height:60%;background:linear-gradient(#10151200 40%,var(--bg) 96%),linear-gradient(#0a0f0c66,#0a0f0c33),var(--hero) 30% 40%/cover;filter:saturate(.85)}
.av{background:var(--logo) center/cover;border:2px solid var(--gold)}
.menu .hero{justify-content:flex-end;padding-top:150px}
h1{background:linear-gradient(#f2dfae,#c2a265 60%,#8d6f35);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px #000b);font-size:36px}
.menu .sub{color:#d8d2c0;text-shadow:0 1px 4px #000;margin:0 0 10px;letter-spacing:2px;font-size:13px;text-transform:uppercase}
.tick{background:#0006;border:1px solid #c2a26566;border-radius:20px;padding:7px 14px;margin-bottom:14px;font-size:14px;color:var(--gold)}
.tick span{display:inline-block;transition:opacity .35s}
#cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));background:#0a0f0c;transition:opacity .4s}
#cbg{position:absolute;inset:0;background:center/cover;filter:blur(24px) brightness(.4);transform:scale(1.2)}
#cimg{position:relative;width:100%;max-width:min(520px,92vw);max-height:68vh;object-fit:contain;border-radius:16px;box-shadow:0 8px 30px #000a}
#cover .btn{position:relative;max-width:420px}

#game::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 25%,#3a1a28 0%,#170f15 65%,#0c0809 100%),url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text x='10' y='44' font-size='34' fill='%23ffffff0c'>♠</text><text x='68' y='104' font-size='34' fill='%23ffffff0c'>♦</text></svg>")}
#game .felt{border-radius:50%/14%;background:radial-gradient(ellipse at 50% 42%,#3a6650 0%,#22402f 62%,#17291f 100%);box-shadow:0 0 0 7px #6e4a2a,0 0 0 9px #c2a26588,0 10px 30px #000c,inset 0 0 70px #000b;margin:12px 4px 6px;padding:10px 6px 8px}
.oppw{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px}
.avw{position:relative}
.avt{width:54px;height:54px;border-radius:50%;background:center/cover #222;border:3px solid #6e4a2a;box-shadow:0 2px 8px #000a}
.avt.turn{border-color:var(--gold);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #c2a26555,0 0 16px #c2a265aa}}
.role{position:absolute;left:-8px;bottom:-4px;font-size:15px;background:#000a;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cnt{position:absolute;right:-8px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#2a1d00;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.nmc{font-size:12px;background:#000a;border-radius:10px;padding:2px 10px;color:var(--tx)}
.fan{display:flex;justify-content:center;height:30px;overflow:hidden;margin-top:2px}.fan .c{width:30px;height:44px;border-radius:5px;border-width:1px}
.seatme{display:flex;justify-content:center}.seatme .seat{flex-direction:row;gap:8px}
.c{position:relative}
.c b{position:absolute;top:4px;left:6px;font-size:17px;line-height:1;color:inherit}body{background:none}
.c s{position:absolute;top:22px;left:6px;font-size:13px;line-height:1;text-decoration:none}
.c i{font-size:36px;line-height:1;margin-top:8px}
.c.sm b{font-size:12px;top:3px;left:4px}.c.sm s{top:16px;left:4px;font-size:10px}.c.sm i{font-size:22px;margin-top:6px}
.hand{overflow:visible!important;justify-content:center!important;padding:22px 6px 2px}
.hand .c{transform-origin:50% 130%;transition:transform .15s,filter .15s}
.hand .c.no{filter:brightness(.72)}

 for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}

 const p=mine?myPic():pic(v.pics[s],s),st=(mine&&!p)?'background-image:var(--logo)':"background-image:url('"+p+"')";
 return '<div class="seat" data-seat="'+s+'"><div class="avw"><div class="avt'+(turn?' turn':'')+'" style="'+st+'"></div>'+(role?'<span class="role">'+role+'</span>':'')+'<span class="cnt">'+v.cnt[s]+'</span></div><div class="nmc">'+esc(v.names[s])+'</div></div>'}
function setView(v){V=v;tlEnd=Date.now()+(v.tl||30)*1000;render()}
function render(){
 if(!V)return;const v=V,me=v.me,n=v.n,act=v.act||[],un=v.table.filter(x=>!x.d),myAct=!v.over&&act.includes(me),fr=FRESH;FRESH=0;NEWC=0;
 if(!v.table.length)shown.clear();
 const ops=[];for(let k=1;k<n;k++)ops.push((me+k)%n);
 const c0=v.cnt[ops[0]];
 $('opp').innerHTML='<div class="orow">'+ops.map(s=>seatH(s,0)).join('')+'</div>'+(n===2?'<div class="fan">'+Array.from({length:c0}).map((_,i)=>'<div class="c sm back" style="margin-left:'+(i?Math.min(14,Math.max(4,150/Math.max(1,c0)))-30:0)+'px"></div>').join('')+'</div>':'');
 $('mseat').innerHTML=seatH(me,1);
 const tcl=$('tr');tcl.textContent=S[v.tr];tcl.style.color=(v.tr===1||v.tr===2)?'#c9696f':'';
 $('pile').innerHTML=v.deck?card(v.trumpCard).replace('class="c ','class="c sm ')+'<div class="c sm back" style="margin-left:-14px"></div><span>Колода: <b>'+v.deck+'</b></span>':'<span>Колода пуста</span>';
 $('tbl').innerHTML=v.table.map(x=>'<div class="pair">'+tcard(x.a)+(x.d?tcard(x.d,'d'):'')+'</div>').join('');
 if(NEWC){sfx('card');hap('tap')}
 const m=$('me'),h=v.hand.length,step=Math.min(46,Math.max(14,(330-58)/Math.max(1,h-1))),hl=!v.over&&!v.out.includes(me)&&(myAct||(me!==v.def&&v.table.length>0));
 m.innerHTML=v.hand.map((c,i)=>{const o=i-(h-1)/2,ok=legalNow(c),rot=o*Math.min(5,36/h),ty=o*o*(h>8?.5:1.3)+(hl&&ok?-10:0);
  return card(c,' onclick="play('+i+')" style="margin-left:'+(i?step-58:0)+'px;transform:translateY('+ty+'px) rotate('+rot+'deg);'+(fr?'animation-delay:'+i*90+'ms':'')+'"').replace('class="c ','class="c '+(fr?'deal ':'')+((hl&&!ok)?'no ':'')+'')}).join('');
 let s,l,en=false;
 if(v.over){s='';l='Игра окончена'}
 else if(v.out.includes(me)){s='✅';l='Вы вышли'}
 else if(myAct){
  if(me===v.def&&un.length&&!v.taking){s='Бейте карту или возьмите';l='Взять';en=true}
  else if(!v.table.length){s='Ваш ход — атакуйте';l='Ваш ход'}
  else{s=v.taking?'Подкиньте или нажмите Готово':'Подкиньте карту или нажмите Бито';l=v.taking?'Готово':'Бито';en=true}}
 else if(v.taking&&me===v.def){s='Вы берёте карты…';l='Ход соперника'}
 else{const a=act.filter(i=>i!==me)[0];s=a===undefined?'':v.names[a]+' '+(a===v.def?'отбивается…':'ходит…');l='Ход соперника'}
 $('st').textContent=s;const b=$('act');b.textContent=l;b.disabled=!en;tick()}
function tick(){const tm=$('tm');if(!V||V.over||!V.act){tm.textContent='⏳';return}const my=V.act.includes(V.me),left=Math.max(0,Math.ceil((tlEnd-Date.now())/1000));tm.textContent=my?'⏳ '+left:'👀'}
setInterval(()=>{tick();if(V&&!V.over&&!PVP&&L&&V.act.includes(V.me)&&Date.now()>tlEnd){tlEnd=Date.now()+30000;const m=aiMove(L.g,0,'medium');if(m)send(m)}},500);
function bad(i){const e=$('me').children[i];if(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}hap('bad')}
function play(i){if(!V||V.over)return;const c=V.hand[i];if(!c||!legalNow(c))return bad(i);send({t:'play',i})}
function actBtn(){if(!V||V.over||!V.act.includes(V.me))return;sfx('tap');send({t:'act'})}
function send(m){
 if(PVP){if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));return}
 if(!L||L.g.over)return;const ok=m.t==='play'?gPlay(L.g,0,m.i):gAct(L.g,0);if(ok)afterLocal();else if(m.t==='play')bad(m.i)}
function afterLocal(){const l=L;if(!l)return;setView(Object.assign(gView(l.g,0),{names:l.names,pics:l.pics,tl:30}));
 if(l.g.over){setTimeout(()=>{if(L===l)finishGame(gRes(l.g,0),l.g.durak>=0?l.names[l.g.durak]:'')},900);return}
 if(gActors(l.g).some(p=>l.bots[p]))setTimeout(()=>{if(L!==l||l.g.over)return;if(aiTurn(l.g,l.bots))afterLocal()},BOTMS)}
function startLocal(k,lvl){closeM();k=+k||save.set.bots||1;lvl=lvl||save.set.lvl||'medium';
 if(save.coins<BET){openShop();return}
 leave();save.coins-=BET;persist();
 const g=gNew(k+1),pool=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,k),names=[$('nm').textContent],pics=[myPic()],bots={};
 pool.forEach((pi,j)=>{names.push(NM[pi]);pics.push('av:'+pi);bots[j+1]=lvl});
 L={g,bots,names,pics,lvl,n:k+1};V=null;FRESH=1;shown.clear();
 for(let i=0;i<6;i++)setTimeout(()=>sfx('deal'),i*90);
 show('game');afterLocal()}
function finishGame(res,dn){
 const local=!!L;if(V){V.over=true;render()}
 const pay={win:BET*2,safe:BET,draw:BET,lose:0}[res]||0;save.coins+=pay;
 if(res==='win'){mroll();save.wins++;save.mw=(save.mw||0)+1;setTimeout(confetti,150)}else if(res==='lose')save.losses++;
 persist();hud();sfx(res==='win'?'win':res==='lose'?'lose':'coin');hap(res==='win'?'ok':res==='lose'?'bad':'tap');
 if(local)report();setTimeout(sync,1500);
 const T={win:['🏆 Победа!','Вы выиграли '+BET+' монет!'+(save.mw===GOAL?' 🎉 Приз месяца открыт — заберите в меню!':'')],safe:['✅ Вы вышли из игры!','Дурак — '+dn+'. Ставка возвращена.'],draw:['🤝 Ничья','Ставка возвращена.'],lose:['💀 Вы — дурак!','Вы проиграли '+BET+' монет. Реванш?']}[res]||['','']; 
 modal('<h2>'+T[0]+'</h2><p>'+esc(T[1])+'</p><button class="btn" onclick="rematch()">⚔️ Реванш ('+BET+' 🪙)</button><button class="btn sec" onclick="toMenu()">В главное меню</button>')}
function rematch(){if(L)startLocal(L.n-1,L.lvl);else pvpAgain()}
function toMenu(){closeM();leave();L=null;V=null;show('menu')}
function surrender(){if(!V||V.over)return;if(confirm('Сдаться? Ставка будет потеряна.')){if(L)L.g.over=true;leave();finishGame('lose','')}}
/* ---------- эмоции и чат ---------- */
const EM=['😂','😡','👍','😱','🔥','🤝','😎','😭'],PHR=['Привет!','Ходи!','Красиво!','Быстрее!'];
function buildEmo(){$('emo').innerHTML='<div class="er">'+EM.map(e=>'<button onclick="sendEmo(\''+e+'\')">'+e+'</button>').join('')+'</div><div class="er">'+PHR.map(p=>'<button class="ph2" onclick="sendChat(\''+p+'\')">'+p+'</button>').join('')+'</div><div class="er"><input id="cin" maxlength="40" placeholder="Сообщение"><button class="ph2" onclick="sendChat()">Отправить</button></div><div class="er"><button class="ph2" id="tch" onclick="toggleChat()"></button></div>'}
function toggleEmo(){const e=$('emo');e.classList.toggle('hidden');$('tch').textContent=save.nochat?'Показать чат':'Скрыть чат'}
function toggleChat(){save.nochat=!save.nochat;persist();$('tch').textContent=save.nochat?'Показать чат':'Скрыть чат'}
function fl(s,t,b){const a=document.querySelector('[data-seat="'+s+'"] .avw');if(!a)return;const r=a.getBoundingClientRect(),e=document.createElement('div');e.className='fl'+(b?' bub':'');e.textContent=t;e.style.left=(r.left+r.width/2)+'px';e.style.top=(r.top+(b?-8:0))+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2400);sfx('tap')}
function showEmo(s,e){fl(s,e,0)}
function showChat(s,t){if(save.nochat&&V&&s!==V.me)return;fl(s,t,1)}
function sendEmo(e){$('emo').classList.add('hidden');if(PVP){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'emo',e}));return}
 showEmo(0,e);if(L){const b=Object.keys(L.bots);if(b.length)setTimeout(()=>showEmo(+b[Math.random()*b.length|0],EM[Math.random()*EM.length|0]),900+Math.random()*900)}}
function sendChat(t){t=String(t||$('cin').value).trim().slice(0,40);if(!t)return;$('cin').value='';$('emo').classList.add('hidden');
 if(PVP){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'chat',m:t}))}else showChat(0,t)}
/* ---------- онлайн-столы ---------- */
const rc=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const LVLN={easy:'Лёгкий',medium:'Средний',hard:'Сложный'};
function shareRoom(r){const u='https://t.me/share/url?url='+encodeURIComponent('https://t.me/'+BOT+'?start='+r)+'&text='+encodeURIComponent('Сыграем в дурака? 🃏');if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
function waitBox(m){modal('<h2>⏳ Ждём игроков</h2><p>Код стола: <b>'+esc(m.code)+'</b></p>'+m.seats.map(s=>'<div class="lr"><span>'+(s?(s.bot?'🤖 ':'👤 ')+esc(s.name):'…')+'</span></div>').join('')+'<button class="btn" onclick="shareRoom(\''+esc(m.code)+'\')">📨 Пригласить друга</button>'+(m.host&&m.seats.some(s=>!s)?'<button class="btn sec" onclick="addBot()">🤖 Добавить бота ('+LVLN[save.set.lvl]+')</button>':'')+'<button class="btn sec" onclick="cancelWait()">Отмена</button>')}
function addBot(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'addbot',lvl:save.set.lvl||'medium'}))}
function cancelWait(){leave();closeM()}
function leave(){PVP=false;const w=ws;ws=null;if(w){try{w.close()}catch(e){}}}
function pvpAgain(){if(ws&&ws.readyState===1){ws.send(JSON.stringify({t:'again'}));modal('<h2>⏳ Ждём ответа игроков</h2><button class="btn sec" onclick="toMenu()">В главное меню</button>')}else toMenu()}
function pvpJoin(room,o){o=o||{};if(!room)return;if(save.coins<BET){closeM();return openShop()}
 leave();PVP=true;L=null;V=null;
 const q='room='+encodeURIComponent(room)+(o.create?'&n='+o.n+'&pub='+o.pub:'')+'&name='+encodeURIComponent($('nm').textContent)+'&init='+encodeURIComponent((tg&&tg.initData)||'');
 const w=ws=new WebSocket(WS+'/ws?'+q);
 w.onmessage=e=>{const v=JSON.parse(e.data);
  if(v.t==='wait'){V=null;waitBox(v)}
  else if(v.t==='full'){leave();modal('<h2>Стол занят</h2><button class="btn" onclick="closeM()">OK</button>')}
  else if(v.t==='state'){if(!V||V.over){if(save.coins<BET){leave();return openShop()}save.coins-=BET;persist();FRESH=1;shown.clear();for(let i=0;i<6;i++)setTimeout(()=>sfx('deal'),i*90)}
   closeM();show('game');setView(v)}
  else if(v.t==='over')finishGame(v.res,v.dn)
  else if(v.t==='emo')showEmo(v.from,v.e)
  else if(v.t==='chat')showChat(v.from,v.m)};
 w.onclose=()=>{if(ws!==w)return;ws=null;if(V&&!V.over){PVP=false;finishGame('lose','')}else{PVP=false;closeM();toast('⚠️ Offline')}}}
function createTable(){pvpJoin(rc(),{create:1,n:save.set.n||2,pub:$('pub').checked?1:0})}
function joinCode(){pvpJoin($('rcode').value.trim().toUpperCase())}
/* ---------- лобби ---------- */
function seg(id,opts,cur,fn){$(id).innerHTML=opts.map(o=>'<button class="'+(o[0]==cur?'on':'')+'" onclick="'+fn+'(\''+o[0]+'\')">'+o[1]+'</button>').join('')}

function setLvl(v){save.set.lvl=v;persist();lobbyUi()}

 $('onm').textContent='🟢 Онлайн: '+j.online;$('onl').textContent='🟢 Онлайн: '+j.online;
 $('tbl2').innerHTML=j.tables.length?j.tables.map(t=>'<div class="lr"><span>'+esc(t.host)+' · '+t.filled+'/'+t.n+(t.bots?' 🤖'+t.bots:'')+'</span><button class="btn" style="width:auto;padding:8px 16px" onclick="pvpJoin(\''+esc(t.id)+'\')">Войти</button></div>').join(''):'<p>Пока нет открытых столов — создайте свой!</p>'}).catch(()=>{})}
let lbT=null;
function openLobby(){show('lobby');lobbyUi();lobbyPoll();clearInterval(lbT);lbT=setInterval(()=>{if($('lobby').classList.contains('hidden')){clearInterval(lbT);return}lobbyPoll()},4000)}

const cp=PS[Math.random()*PS.length|0];$('cbg').style.backgroundImage='url('+cp+')';$('cimg').src=cp;$('lbimg').src=LB;
function enter(){const c=$('cover');c.style.opacity=0;setTimeout(()=>c.remove(),400);if(save.mus!==0)music(true);sfx('tap')}
const TK=['🎁 Бонус дня ждёт тебя','🃏 Играй с друзьями онлайн','🏆 Взойди на вершину рейтинга','👑 Твоя легенда начинается сейчас'];let tki=0;const tke=$('tk');tke.textContent=TK[0];
setInterval(()=>{tke.style.opacity=0;setTimeout(()=>{tki=(tki+1)%TK.length;tke.textContent=TK[tki];tke.style.opacity=1},350)},3200);
setInterval(()=>{if(!$('menu').classList.contains('hidden'))lobbyPoll()},60000);

document.documentElement.lang=LANG;

walk(document.body);
