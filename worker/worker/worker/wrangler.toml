name = "durak-empire"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
WEBAPP_URL = "https://i-field.github.io/durak-mini-app/"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Stats"]

# 1-го числа каждого месяца в 00:05 UTC — автоначисление наград за прошлый месяц
[triggers]
crons = ["5 0 1 * *"]
