name = "durak-mini-app"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
WEBAPP_URL = "https://i-field.github.io/durak-mini-app/"
# Приветствие бота: видео welcome.mp4 из корня репозитория (если файла нет — отправится welcome.jpg)
WELCOME_VIDEO = "welcome.mp4"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Stats"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# 1-го числа каждого месяца в 00:05 UTC — автоначисление наград за прошлый месяц
[triggers]
crons = ["5 0 1 * *"]
